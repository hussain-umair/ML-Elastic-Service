apiVersion: v1
kind: Service
metadata:
  name: dispatcher-service
  labels:
    app: dispatcher
spec:
  type: ClusterIP
  selector:
    app: dispatcher
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  - port: 9001
    targetPort: 9001
    protocol: TCP
    name: metrics